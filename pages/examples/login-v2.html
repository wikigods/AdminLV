<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdminLV 4 | Log in (v2)</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="../../dist/css/adminlv.min.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <!-- /.login-logo -->
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <a href="../../index2.html" class="h1"><b>Admin</b>LTE</a>
    </div>
    <div class="card-body">
      <p class="login-box-msg">Sign in to start your session</p>

      <form action="../../index3.html" method="get">
        <div class="input-group mb-3">
          <input type="email" class="form-control" placeholder="Email">
          
            <div class="input-group-text">
              <span class="fa-solid fa-envelope"></span>
            </div>
          
        </div>
        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Password">
          
            <div class="input-group-text">
              <span class="fa-solid fa-lock"></span>
            </div>
          
        </div>
        <div class="row">
          <div class="col-8">
            <div class="form-check login-remember">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label" for="remember">Remember Me</label>
            </div>
          </div>
          <!-- /.col -->
          <div class="col-4">
            <button type="submit" class="btn btn-primary d-block w-100">Sign In</button>
          </div>
          <!-- /.col -->
        </div>
      </form>

      <div class="social-auth-links text-center mt-2 mb-3">
        <a href="#" class="btn d-block w-100 btn-primary">
          <i class="fa-brands fa-facebook me-2"></i> Sign in using Facebook
        </a>
        <a href="#" class="btn d-block w-100 btn-danger">
          <i class="fa-brands fa-google-plus me-2"></i> Sign in using Google+
        </a>
      </div>
      <!-- /.social-auth-links -->

      <p class="mb-1">
        <a href="forgot-password-v2.html">I forgot my password</a>
      </p>
      <p class="mb-0">
        <a href="register-v2.html" class="text-center">Register a new membership</a>
      </p>
    </div>
    <!-- /.card-body -->
  </div>
  <!-- /.card -->
</div>
<!-- /.login-box -->

<!-- Bootstrap 5 -->
<script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<!-- AdminLV App -->
<script src="../../dist/js/adminlv.min.js"></script>
</body>
</html>
